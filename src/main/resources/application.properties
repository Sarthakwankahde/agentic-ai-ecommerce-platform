# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/agentic_ai_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
server.port=8081
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh.expiration=604800000
# Razorpay
razorpay.key.id=rzp_test_TA5P2V9A8vRhHk
razorpay.key.secret=${RAZORPAY_SECRET}
# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sarthakwankhade2003.sw@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4.1-mini
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=500
# Frontend configuration
app.frontend.url=${FRONTEND_URL}
